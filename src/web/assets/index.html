<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ESP32-C3 IR Controller</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >
</head>

<body>

<div class="dashboard">

    <!-- ===================================================== -->
    <!-- HEADER                                                 -->
    <!-- ===================================================== -->

    <header class="header-card">

        <div class="header-left">

            <img
                src="/Michal.png"
                alt="Logo"
                class="device-logo"
            >

            <div>

                <div class="eyebrow">
                    ESP32 Controller
                </div>

                <h1 id="deviceName">
                    ESP32-C3 IR Controller
                </h1>

                <div class="serial">

                    SN:
                    <span id="deviceSerial">
                        ----------
                    </span>

                </div>

            </div>

        </div>


        <div class="header-right">

            <div
                id="deviceStatus"
                class="status-badge status-offline"
            >

                <span class="status-dot"></span>

                <span id="deviceStatusText">

                    OFFLINE

                </span>

            </div>

        </div>

    </header>



    <!-- ===================================================== -->
    <!-- STATUS                                                 -->
    <!-- ===================================================== -->

    <section class="card">

        <div class="card-title">

            Status urządzenia

        </div>

        <div class="status-grid">

            <div class="status-item">

                <div class="status-label">
                    Wi-Fi
                </div>

                <div
                    id="wifiStatus"
                    class="status-value"
                >
                    --
                </div>

            </div>


            <div class="status-item">

                <div class="status-label">
                    IP
                </div>

                <div
                    id="wifiIp"
                    class="status-value"
                >
                    --
                </div>

            </div>


            <div class="status-item">

                <div class="status-label">
                    RSSI
                </div>

                <div
                    id="wifiRssi"
                    class="status-value"
                >
                    --
                </div>

            </div>


            <div class="status-item">

                <div class="status-label">
                    MQTT
                </div>

                <div
                    id="mqttStatus"
                    class="status-value"
                >
                    --
                </div>

            </div>


            <div class="status-item">

                <div class="status-label">
                    Uptime
                </div>

                <div
                    id="systemUptime"
                    class="status-value"
                >
                    --
                </div>

            </div>


            <div class="status-item">

                <div class="status-label">
                    RAM
                </div>

                <div
                    id="systemHeap"
                    class="status-value"
                >
                    --
                </div>

            </div>

        </div>

    </section>



    <!-- ===================================================== -->
    <!-- PWM                                                    -->
    <!-- ===================================================== -->

    <section class="card">

        <div class="card-title">

            Sterowanie PWM

        </div>

        <div class="pwm-grid">

            <div class="pwm-card">

                <div class="pwm-header">

                    <div>

                        <h3>PWM1</h3>

                        <div class="gpio">

                            GPIO2 / D0

                        </div>

                    </div>

                    <div
                        id="pwmValue0"
                        class="pwm-value"
                    >
                        0%
                    </div>

                </div>

                <input
                    id="pwmSlider0"
                    type="range"
                    min="0"
                    max="100"
                >

            </div>



            <div class="pwm-card">

                <div class="pwm-header">

                    <div>

                        <h3>PWM2</h3>

                        <div class="gpio">

                            GPIO3 / D1

                        </div>

                    </div>

                    <div
                        id="pwmValue1"
                        class="pwm-value"
                    >
                        0%
                    </div>

                </div>

                <input
                    id="pwmSlider1"
                    type="range"
                    min="0"
                    max="100"
                >

            </div>



            <div class="pwm-card">

                <div class="pwm-header">

                    <div>

                        <h3>PWM3</h3>

                        <div class="gpio">

                            GPIO4 / D2

                        </div>

                    </div>

                    <div
                        id="pwmValue2"
                        class="pwm-value"
                    >
                        0%
                    </div>

                </div>

                <input
                    id="pwmSlider2"
                    type="range"
                    min="0"
                    max="100"
                >

            </div>



            <div class="pwm-card">

                <div class="pwm-header">

                    <div>

                        <h3>PWM4</h3>

                        <div class="gpio">

                            GPIO5 / D3

                        </div>

                    </div>

                    <div
                        id="pwmValue3"
                        class="pwm-value"
                    >
                        0%
                    </div>

                </div>

                <input
                    id="pwmSlider3"
                    type="range"
                    min="0"
                    max="100"
                >

            </div>

        </div>

    </section>

    <!-- ===================================================== -->
    <!-- RELAY                                            -->
    <!-- ===================================================== -->

    <section class="card">

        <div class="card-title">
            Przekaźnik
        </div>

        <div class="relay-card">

            <div>
                <h3>Relay 1</h3>

                <div class="gpio">
                    GPIO6
                </div>
            </div>

            <button
                id="relayButton0"
                class="relay-button relay-off"
                type="button"
            >
                OFF
            </button>

        </div>

    </section>


    <!-- ===================================================== -->
    <!-- TEMPERATURE                                            -->
    <!-- ===================================================== -->

    <section class="card">

        <div class="card-title">

            Temperatura

        </div>

        <div
            id="temperatureSensors"
            class="temperature-grid"
        >

            <div class="empty-state">

                Oczekiwanie na dane...

            </div>

        </div>

    </section>



    <!-- ===================================================== -->
    <!-- RESTART                                                -->
    <!-- ===================================================== -->

    <section class="card">

        <button
            id="restartButton"
            class="restart-button"
        >

            Restart ESP32

        </button>

    </section>


    <div
        id="message"
        class="message"
    ></div>

</div>

<script src="/app.js"></script>

</body>
</html>
